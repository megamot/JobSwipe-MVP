<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSwipe MVP Prototype</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f0f2f5; 
        }
        
        /* --- Стилі для тегів --- */
        #tags-section {
            max-width: 600px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .tag-label {
            position: relative;
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background: #e0f7fa;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tag-label:hover {
            background: #b2ebf2;
        }
        
        .tag-tooltip {
            visibility: hidden;
            position: absolute;
            z-index: 1;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            white-space: pre-wrap;
            max-width: 250px;
            text-align: center;
            margin-bottom: 5px;
        }
        
        .tag-label:hover .tag-tooltip {
            visibility: visible;
        }
        
        /* Трикутник під тултіпом */
        .tag-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.8) transparent transparent transparent;
        }
        
        /* --- Інші стилі залишаються без змін --- */
        .card-container { width: 350px; height: 450px; position: relative; }
        .job-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.5s ease-out;
            cursor: grab;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .card-title { font-size: 1.4em; font-weight: bold; margin-bottom: 5px; color: #333; }
        .card-company { font-size: 1em; color: #555; }
        .card-tags { margin-top: 10px; }
        .tag { display: inline-block; background-color: #e0f7fa; color: #00838f; border-radius: 15px; padding: 5px 12px; margin: 4px; font-size: 0.9em; }
        .swipe-info { text-align: center; margin-top: 20px; font-weight: bold; color: #666; }
        
        /* Стилі для чекбоксів */
        input[type="checkbox"] {
            margin-right: 5px;
        }
        
        /* Стилі для кнопок */
        button {
            background-color: #00838f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #006064;
        }
    </style>
</head>
<body>
    <div style="position: absolute; top: 10px; left: 10px; display: flex; gap: 20px;">
        <a href="user.html" id="cabinet-link" style="font-size: 1.1em; color: #00838f; text-decoration: underline;">Кабінет користувача</a>
        <button id="logout-btn" style="font-size:1em; color:#fff; background:#f44336; border:none; border-radius:5px; padding:5px 15px; display:none; cursor:pointer;">Вихід</button>
    </div>

    <div id="auth-section">
        <h2>Вхід / Реєстрація</h2>
        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />
        <button onclick="register()">Реєстрація</button>
        <button onclick="login()">Вхід</button>
        <div id="auth-msg" style="color: red; margin-top: 5px;"></div>
    </div>

    <div id="tags-section" style="display:none;">
        <h3>Оберіть теги:</h3>
        <div id="tags-list"></div>
        <button onclick="saveTags()">Зберегти теги</button>
    </div>

    <div class="card-container" id="card-container" style="display:none;">
        <p>Завантаження вакансій...</p>
    </div>

    <div class="swipe-info" id="swipe-controls" style="display:none;">
        <button onclick="simulateSwipe('like')" style="background-color: #4CAF50;">Свайп Праворуч (👍)</button>
        <button onclick="simulateSwipe('nope')" style="background-color: #f44336;">Свайп Ліворуч (👎)</button>
    </div>

    <script>
        // --- КОНФІГУРАЦІЯ ---
        const API_URL = 'http://127.0.0.1:5000/api/vacancies';
        const SWIPE_URL = 'http://127.0.0.1:5000/api/swipe';
        const REGISTER_URL = 'http://127.0.0.1:5000/api/register';
        const LOGIN_URL = 'http://127.0.0.1:5000/api/login';
        const TAGS_URL = 'http://127.0.0.1:5000/api/user/tags';
        const cardContainer = document.getElementById('card-container');
        let currentVacancies = [];
        let userId = null;
        let selectedTags = [];

        // --- ПІДКАЗКИ ДЛЯ ТЕГІВ ---
        const TAG_HINTS = {
            '#OfficeManager': ['офіс-менеджер', 'office manager', 'адміністратор офісу', 'head of office', 'administration'],
            '#ExecutiveAssistant': ['асистент керівника', 'помічник керівника', 'executive assistant', 'personal assistant', 'pa', 'виконавчий асистент'],
            '#AdministrativeAssistant': ['адміністративний асистент', 'admin assistant', 'administrative support', 'адміністративна підтримка', 'секретар', 'receptionist', 'адміністратор'],
            '#ProcurementManager': ['менеджер із закупівель', 'procurement specialist', 'purchasing manager', 'закупник', 'buyer', 'фахівець з постачання', 'постачальник'],
            '#SaleAssistant': ['sale assistant', 'sale support', 'асистент з продажів', 'менеджер з продажу', 'продавець-консультант', 'sales'],
            '#BusinessOwner': ['підприємець', 'керівник', 'власний бізнес', 'business owner', 'founder', 'ceo'],
            '#LogisticsManager': ['менеджер з транспорту', 'логіст', 'координація логістики', 'logistics', 'transport manager', 'supply chain'],
            '#DocumentManagement': ['документообіг', 'договірна робота', 'робота з документами', 'супровід документообігу', 'договори', 'contract management'],
            '#OfficeMaintenance': ['підтримка життєдіяльності офісу', 'office support', 'адміністративно-господарська діяльність', 'забезпечення офісу'],
            '#VendorManagement': ['взаємодія з постачальниками', 'пошук постачальників', 'робота з постачальниками', 'постачання', 'vendors', 'постачальники'],
            '#CustomerService': ['робота з клієнтами', 'клієнтський сервіс', 'customer service', 'customer support', 'обслуговування клієнтів'],
            '#Purchasing': ['закупівлі', 'постачання продукції', 'замовлення', 'контроль постачання', 'buying', 'procurement'],
            '#StaffManagement': ['управління персоналом', 'підбір персоналу', 'team management', 'керівництво командою'],
            '#Budgeting': ['бюджетування', 'фінансовий контроль', 'кошторис', 'фінанси'],
            '#PrimaryAccounting': ['ведення первинної бухгалтерії', 'первинна документація', 'робота в 1с', 'координація з бухгалтерією', 'invoices', 'бухгалтерія', 'cash'],
            '#1C': ['1с', '1с:бухгалтерія', 'робота в 1с'],
            '#MicrosoftOffice': ['microsoft office', 'word', 'excel', 'powerpoint', 'MS office'],
            '#CRM': ['crm', 'customer relationship management', 'срм'],
            '#Trello': ['trello', 'трелло', 'project management tool'],
            '#PhotoshopAdobe': ['photoshop', 'adobe', 'графічні редактори', 'дизайн'],
            '#EnglishBeginner': ['англійська початковий', 'beginner', 'a1', 'a2', 'elementary', 'pre-intermediate', 'базовий'],
            '#EnglishIntermediate': ['англійська середній', 'intermediate', 'b1', 'b2', 'upper-intermediate', 'середній', 'розмовний'],
            '#EnglishAdvanced': ['англійська просунутий', 'advanced', 'c1', 'c2', 'fluent', 'proficiency', 'вільно', 'native speaker'],
            '#English': ['англійська', 'english', 'мова', 'language', 'іноземна'],
            '#UkrainianFluent': ['українська', 'вільно', 'ukrainian', 'fluent', 'рідна мова'],
            '#Trainee': ['стажер', 'практикант', 'trainee'],
            '#Junior': ['junior', 'початківець', 'молодший спеціаліст'],
            '#Middle': ['middle', 'спеціаліст', 'досвідчений'],
            '#Senior': ['senior', 'старший спеціаліст', 'провідний'],
            '#Executive': ['executive', 'керівник', 'директор', 'head']
        };

        const ALL_TAGS = Object.keys(TAG_HINTS);

        // --- ФУНКЦІЇ ---
        function showTags() {
            document.getElementById('tags-section').style.display = '';
            const tagsList = document.getElementById('tags-list');
            tagsList.innerHTML = '';
            
            ALL_TAGS.forEach(tag => {
                const label = document.createElement('label');
                label.className = 'tag-label';
                
                // Створюємо підказку
                const tooltip = document.createElement('span');
                tooltip.className = 'tag-tooltip';
                tooltip.textContent = TAG_HINTS[tag].join(', ');
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = tag;
                checkbox.checked = selectedTags.includes(tag);
                checkbox.onchange = function() { onTagChange(this); };
                
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(` ${tag}`));
                label.appendChild(tooltip);
                
                tagsList.appendChild(label);
            });
        }

        function onTagChange(checkbox) {
            if (checkbox.checked && !selectedTags.includes(checkbox.value)) {
                selectedTags.push(checkbox.value);
            } else if (!checkbox.checked) {
                selectedTags = selectedTags.filter(t => t !== checkbox.value);
            }
        }

        function saveTags() {
            fetch(TAGS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, tags: selectedTags })
            })
            .then(() => {
                localStorage.setItem('selectedTags', JSON.stringify(selectedTags));
                document.getElementById('tags-section').style.display = 'none';
                cardContainer.style.display = '';
                document.getElementById('swipe-controls').style.display = '';
                fetchVacancies();
            });
        }

        function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            fetch(REGISTER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                if (data.user_id) {
                    userId = data.user_id;
                    localStorage.setItem('userId', userId);
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('logout-btn').style.display = '';
                    fetchUserTags();
                } else {
                    document.getElementById('auth-msg').textContent = data.error || 'Помилка реєстрації';
                }
            });
        }

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                if (data.user_id) {
                    userId = data.user_id;
                    localStorage.setItem('userId', userId);
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('logout-btn').style.display = '';
                    fetchUserTags();
                } else {
                    document.getElementById('auth-msg').textContent = data.error || 'Помилка входу';
                }
            });
        }

        // --- ВАКАНСІЇ ---
        function createCard(vacancy) {
            const card = document.createElement('div');
            card.className = 'job-card';
            card.dataset.id = vacancy.id_source;

            let cityDisplay = vacancy.cityId === 1 ? 'Київ' : 'Місто не вказано';
            if (vacancy.vacancyAddress) {
                cityDisplay += `, ${vacancy.vacancyAddress}`;
            }

            let shortDesc = '';
            if (vacancy.shortDescription) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = vacancy.shortDescription;
                const cleanText = tempDiv.textContent.trim();
                shortDesc = cleanText.split(/[.!?]/)[0];
                if (shortDesc.length > 150) {
                    shortDesc = shortDesc.substring(0, 150) + '...';
                }
                shortDesc += '.';
            }

            const tags = [...new Set((vacancy.tags_tech || []).concat(vacancy.tags_company || []))]
                .filter(tag => tag && tag.trim())
                .slice(0, 5);

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${vacancy.name || 'Назва не вказана'}</div>
                    <div class="card-company">${vacancy.companyName || 'Компанія'} · ${cityDisplay}</div>
                </div>
                <div class="card-tags">
                    ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
                <div class="card-desc" style="margin:10px 0 15px 0; color:#444; font-size:1em; min-height:2em;">${shortDesc || 'Опис відсутній'}</div>
                <button class="details-btn" style="margin-top:auto; background:#00838f; color:#fff; border:none; border-radius:5px; padding:8px 16px; font-size:1em; cursor:pointer;" onclick="event.stopPropagation(); window.location.href='details.html?id=${vacancy.id_source}'">Детальніше</button>
            `;
            return card;
        }

        function simulateSwipe(type) {
            if (currentVacancies.length === 0) {
                alert('Вакансії закінчилися! Перезавантажте сторінку.');
                return;
            }

            if (!userId) {
                alert('Спочатку увійдіть або зареєструйтесь!');
                return;
            }

            const currentCard = cardContainer.querySelector('.job-card');
            const vacancyId = currentCard.dataset.id;

            currentCard.style.transform = type === 'like' 
                ? 'translateX(1000px) rotate(30deg)' 
                : 'translateX(-1000px) rotate(-30deg)';
            currentCard.style.opacity = 0;

            fetch(SWIPE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    id_source: vacancyId,
                    type: type
                })
            })
            .then(response => response.json())
            .then(data => {
                setTimeout(() => {
                    currentCard.remove();
                    currentVacancies = currentVacancies.filter(v => v.id_source !== vacancyId);
                    if (currentVacancies.length > 0) {
                        cardContainer.appendChild(createCard(currentVacancies[0]));
                    } else {
                        fetchVacancies();
                    }
                }, 500);
            })
            .catch(error => {
                console.error('Swipe error:', error);
                alert('Помилка при обробці свайпу.');
            });
        }

        async function fetchVacancies() {
            if (!userId) return;
            cardContainer.innerHTML = '<p style="text-align:center;"><i>Завантаження вакансій...</i></p>';

            try {
                const userProfileResponse = await fetch('http://127.0.0.1:5000/api/user/profile?user_id=' + encodeURIComponent(userId));
                const userProfile = await userProfileResponse.json();
                const likedVacancies = userProfile.liked_vacancies || [];
                const rejectedVacancies = userProfile.rejected_vacancies || [];
                const viewedVacancies = new Set([...likedVacancies, ...rejectedVacancies]);

                let url = API_URL + '?user_id=' + encodeURIComponent(userId);
                const response = await fetch(url);
                const vacancies = await response.json();

                if (vacancies.length === 0) {
                    cardContainer.innerHTML = "<p style='text-align:center;'>На жаль, нових вакансій не знайдено.<br>Спробуйте змінити теги.</p>";
                    return;
                }

                let availableVacancies = vacancies.filter(vacancy => !viewedVacancies.has(vacancy.id_source));

                availableVacancies.sort((a, b) => {
                    const dateA = new Date(a.date || 0);
                    const dateB = new Date(b.date || 0);
                    return dateB - dateA;
                });

                if (selectedTags && selectedTags.length > 0) {
                    availableVacancies = availableVacancies.filter(vacancy => {
                        const vacancyTags = [...(vacancy.tags_tech || []), ...(vacancy.tags_company || [])];
                        return selectedTags.some(tag => vacancyTags.includes(tag));
                    });
                }

                if (availableVacancies.length === 0) {
                    cardContainer.innerHTML = "<p style='text-align:center;'>Не знайдено нових вакансій, що відповідають вашим тегам.<br>Спробуйте змінити налаштування тегів.</p>";
                    return;
                }

                currentVacancies = availableVacancies;
                cardContainer.innerHTML = '';
                cardContainer.appendChild(createCard(currentVacancies[0]));

            } catch (error) {
                console.error('Error fetching vacancies:', error);
                cardContainer.innerHTML = "<p style='text-align:center; color: #d32f2f;'>Помилка завантаження вакансій.<br>Спробуйте оновити сторінку.</p>";
            }
        }

        function fetchUserTags() {
            let tags = JSON.parse(localStorage.getItem('selectedTags')) || [];
            function afterTagsLoaded() {
                if (!selectedTags || selectedTags.length === 0) {
                    document.getElementById('tags-section').style.display = '';
                    cardContainer.style.display = 'none';
                    document.getElementById('swipe-controls').style.display = 'none';
                    showTags();
                } else {
                    document.getElementById('tags-section').style.display = 'none';
                    cardContainer.style.display = '';
                    document.getElementById('swipe-controls').style.display = '';
                    fetchVacancies();
                }
            }
            if (tags.length) {
                selectedTags = tags;
                afterTagsLoaded();
            } else {
                fetch('http://127.0.0.1:5000/api/user/profile?user_id=' + encodeURIComponent(userId))
                    .then(r => r.json())
                    .then(data => {
                        selectedTags = data.selected_tags || [];
                        localStorage.setItem('selectedTags', JSON.stringify(selectedTags));
                        afterTagsLoaded();
                    });
            }
        }

        // --- АВТОМАТИЧНИЙ ВХІД ---
        document.getElementById('logout-btn').onclick = function() {
            userId = null;
            selectedTags = [];
            localStorage.removeItem('userId');
            localStorage.removeItem('selectedTags');
            document.getElementById('auth-section').style.display = '';
            document.getElementById('tags-section').style.display = 'none';
            cardContainer.style.display = 'none';
            document.getElementById('swipe-controls').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('cabinet-link').addEventListener('click', function(e) {
                if (!localStorage.getItem('userId')) {
                    e.preventDefault();
                    alert('Спочатку увійдіть у систему!');
                }
            });
            
            userId = localStorage.getItem('userId');
            if (userId) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('logout-btn').style.display = '';
                fetchUserTags();
            }
        });
    </script>
</body>
</html>
