<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobSwipe MVP Prototype</title>
    <style>
        /* --- CSS для СТИЛІЗАЦІЇ КАРТКИ --- */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f2f5; }
        .card-container { width: 350px; height: 450px; position: relative; }
        .job-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.5s ease-out; /* Анімація для свайпу */
            cursor: grab;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .card-title { font-size: 1.4em; font-weight: bold; margin-bottom: 5px; color: #333; }
        .card-company { font-size: 1em; color: #555; }
        .card-tags { margin-top: 10px; }
        .tag { display: inline-block; background-color: #e0f7fa; color: #00838f; border-radius: 12px; padding: 4px 8px; margin: 3px; font-size: 0.8em; }
        .swipe-info { text-align: center; margin-top: 20px; font-weight: bold; color: #666; }
    </style>
    </head>
<body>

    <div style="position: absolute; top: 10px; left: 10px; display: flex; gap: 20px;">
    <a href="user.html" id="cabinet-link" style="font-size: 1.1em; color: #00838f; text-decoration: underline;">Кабінет користувача</a>
        <button id="logout-btn" style="font-size:1em; color:#fff; background:#f44336; border:none; border-radius:5px; padding:5px 15px; display:none; cursor:pointer;">Вихід</button>
    </div>

    <div id="auth-section">
        <h2>Вхід / Реєстрація</h2>
        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />
        <button onclick="register()">Реєстрація</button>
        <button onclick="login()">Вхід</button>
        <div id="auth-msg" style="color: red; margin-top: 5px;"></div>
    </div>

    <div id="tags-section" style="display:none; margin-bottom: 20px;">
        <h3>Оберіть теги:</h3>
        <div id="tags-list"></div>
        <button onclick="saveTags()">Зберегти теги</button>
    </div>

    <div class="card-container" id="card-container" style="display:none;">
        <p>Завантаження вакансій...</p>
    </div>

    <div class="swipe-info" id="swipe-controls" style="display:none;">
        <button onclick="simulateSwipe('like')" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; margin-right: 15px;">Свайп Праворуч (👍)</button>
        <button onclick="simulateSwipe('nope')" style="background-color: #f44336; color: white; padding: 10px 20px; border: none; border-radius: 5px;">Свайп Ліворуч (👎)</button>
    </div>

    <script>
    const API_URL = 'http://127.0.0.1:5000/api/vacancies';
    const SWIPE_URL = 'http://127.0.0.1:5000/api/swipe';
    const REGISTER_URL = 'http://127.0.0.1:5000/api/register';
    const LOGIN_URL = 'http://127.0.0.1:5000/api/login';
    const TAGS_URL = 'http://127.0.0.1:5000/api/user/tags';
    const cardContainer = document.getElementById('card-container');
    let currentVacancies = [];
    let userId = null;
    let selectedTags = [];

       // 1. ФУНКЦІЯ СТВОРЕННЯ КАРТКИ
        function createCard(vacancy) {
            const card = document.createElement('div');
            card.className = 'job-card';
            card.dataset.id = vacancy.id_source;

            // Обробка міста
            let cityDisplay = vacancy.cityId === 1 ? 'Київ' : vacancy.city || 'Місто не вказано';
            if (vacancy.vacancyAddress) {
                cityDisplay += `, ${vacancy.vacancyAddress}`;
            }

            // Обробка опису
            let shortDesc = '';
            if (vacancy.shortDescription) {
                // Видаляємо HTML теги та зайві пробіли
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = vacancy.shortDescription;
                const cleanText = tempDiv.textContent.trim();
                // Беремо перше речення, обмежуємо довжину
                shortDesc = cleanText.split(/[.!?]/)[0];
                if (shortDesc.length > 150) {
                    shortDesc = shortDesc.substring(0, 150) + '...';
                }
                shortDesc += '.';
            }

            // Фільтруємо унікальні теги
            const tags = [...new Set((vacancy.tags_tech || []).concat(vacancy.tags_company || []))]
                .filter(tag => tag && tag.trim())
                .slice(0, 5);

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${vacancy.name || vacancy.title || 'Назва не вказана'}</div>
                    <div class="card-company">${vacancy.companyName || vacancy.company_name || 'Компанія'} · ${cityDisplay}</div>
                </div>
                <div class="card-tags">
                    ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                </div>
                <div class="card-desc" style="margin:10px 0 15px 0; color:#444; font-size:1em; min-height:2em;">${shortDesc || 'Опис відсутній'}</div>
                <button class="details-btn" style="margin-top:auto; background:#00838f; color:#fff; border:none; border-radius:5px; padding:8px 16px; font-size:1em; cursor:pointer;" onclick="event.stopPropagation(); window.location.href='details.html?id=${vacancy.id_source}'">Детальніше</button>
            `;
            return card;
        }

        // 2. ФУНКЦІЯ ОБРОБКИ СВАЙПУ (ІМІТАЦІЯ)
        function simulateSwipe(type) {
            if (currentVacancies.length === 0) {
                alert('Вакансії закінчилися! Перезавантажте сторінку.');
                return;
            }
            if (!userId) {
                alert('Спочатку увійдіть або зареєструйтесь!');
                return;
            }
            const topCard = cardContainer.querySelector('.job-card');
            const vacancyId = topCard.dataset.id;
            fetch(SWIPE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    id_source: vacancyId,
                    type: type
                })
            })
            .then(response => response.json())
            .then(data => {
                // Візуальна анімація
                topCard.style.transform = type === 'like' 
                    ? 'translateX(1000px) rotate(30deg)' 
                    : 'translateX(-1000px) rotate(-30deg)';
                topCard.style.opacity = 0;
                setTimeout(() => {
                    // Видаляємо верхню картку та оновлюємо DOM і currentVacancies
                    topCard.remove();
                    currentVacancies = currentVacancies.filter(v => v.id_source !== vacancyId);
                    // Перемальовуємо картки, щоб верхня була актуальною
                    cardContainer.innerHTML = '';
                    currentVacancies.slice().reverse().forEach(vacancy => {
                        cardContainer.appendChild(createCard(vacancy));
                    });
                    // Якщо карток мало — підвантажити ще
                    if (currentVacancies.length < 2) {
                        fetchVacancies();
                    }
                }, 500);
            })
            .catch(error => {
                alert('Помилка при обробці свайпу.');
            });
        }

        // 3. ФУНКЦІЯ ЗАВАНТАЖЕННЯ ДАНИХ З API
        function fetchVacancies() {
            if (!userId) return;
            cardContainer.innerHTML = '<p style="text-align:center;"><i>Завантаження вакансій...</i></p>';
            let url = API_URL + '?user_id=' + encodeURIComponent(userId);
            fetch(url)
                .then(response => response.json())
                .then(vacancies => {
                    if (vacancies.length === 0) {
                        cardContainer.innerHTML = "<p style='text-align:center;'>На жаль, нових вакансій не знайдено.<br>Спробуйте змінити теги.</p>";
                        return;
                    }
                    cardContainer.innerHTML = '';
                    // Оновлюємо currentVacancies, додаючи нові вакансії до існуючих
                    const existingIds = currentVacancies.map(v => v.id_source);
                    const newVacancies = vacancies.filter(v => !existingIds.includes(v.id_source));
                    currentVacancies = [...currentVacancies, ...newVacancies];
                    // Показуємо останні 3 картки
                    currentVacancies.slice(-3).reverse().forEach(vacancy => {
                        cardContainer.appendChild(createCard(vacancy));
                    });
                });
        }

        // --- АВТОРИЗАЦІЯ ---
        function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            fetch(REGISTER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                if (data.user_id) {
                    userId = data.user_id;
                    localStorage.setItem('userId', userId);
                    document.getElementById('auth-section').style.display = 'none';
                    fetchUserTags();
                } else {
                    document.getElementById('auth-msg').textContent = data.error || 'Помилка реєстрації';
                }
            });
        }
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                if (data.user_id) {
                    userId = data.user_id;
                    localStorage.setItem('userId', userId);
                    document.getElementById('auth-section').style.display = 'none';
                    fetchUserTags();
                } else {
                    document.getElementById('auth-msg').textContent = data.error || 'Помилка входу';
                }
            });
        }

        // --- ВИБІР ТЕГІВ ---
        const ALL_TAGS = [
            '#Frontend','#Backend','#QA_Testing','#Data','#Marketing','#Design','#Product','#Support_CS','#Legal_Finance','#HR_Admin','#SEO','#AI_ML'
        ];
        function showTags() {
            document.getElementById('tags-section').style.display = '';
            const tagsList = document.getElementById('tags-list');
            tagsList.innerHTML = '';
            ALL_TAGS.forEach(tag => {
                const el = document.createElement('label');
                const checked = selectedTags.includes(tag) ? 'checked' : '';
                el.innerHTML = `<input type='checkbox' value='${tag}' onchange='onTagChange(this)' ${checked}/> ${tag}`;
                tagsList.appendChild(el);
            });
        }
        function onTagChange(checkbox) {
            if (checkbox.checked && !selectedTags.includes(checkbox.value)) selectedTags.push(checkbox.value);
            else if (!checkbox.checked) selectedTags = selectedTags.filter(t => t !== checkbox.value);
        }
        function saveTags() {
            fetch(TAGS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, tags: selectedTags })
            })
            .then(() => {
                localStorage.setItem('selectedTags', JSON.stringify(selectedTags));
                document.getElementById('tags-section').style.display = 'none';
                cardContainer.style.display = '';
                document.getElementById('swipe-controls').style.display = '';
                fetchVacancies();
            });
        }

        // --- Завантаження тегів користувача при вході ---
        function fetchUserTags() {
            let tags = JSON.parse(localStorage.getItem('selectedTags')) || [];
            function afterTagsLoaded() {
                if (!selectedTags || selectedTags.length === 0) {
                    // Show tag selection UI, hide swipe UI
                    document.getElementById('tags-section').style.display = '';
                    cardContainer.style.display = 'none';
                    document.getElementById('swipe-controls').style.display = 'none';
                    showTags();
                } else {
                    // Hide tag selection, show swipe UI
                    document.getElementById('tags-section').style.display = 'none';
                    cardContainer.style.display = '';
                    document.getElementById('swipe-controls').style.display = '';
                    fetchVacancies();
                }
            }
            if (tags.length) {
                selectedTags = tags;
                afterTagsLoaded();
            } else {
                fetch('http://127.0.0.1:5000/api/user/profile?user_id=' + encodeURIComponent(userId))
                    .then(r => r.json())
                    .then(data => {
                        selectedTags = data.selected_tags || [];
                        localStorage.setItem('selectedTags', JSON.stringify(selectedTags));
                        afterTagsLoaded();
                    });
            }
        }

        // --- Автоматичний вхід, якщо userId вже є ---
        // --- Вихід (logout) ---
        document.getElementById('logout-btn').onclick = function() {
            userId = null;
            selectedTags = [];
            localStorage.removeItem('userId');
            localStorage.removeItem('selectedTags');
            document.getElementById('auth-section').style.display = '';
            document.getElementById('tags-section').style.display = 'none';
            cardContainer.style.display = 'none';
            document.getElementById('swipe-controls').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
        };

        window.addEventListener('DOMContentLoaded', () => {
        // --- Заборонити перехід у кабінет незалогіненим ---
        document.getElementById('cabinet-link').addEventListener('click', function(e) {
            if (!localStorage.getItem('userId')) {
                e.preventDefault();
                alert('Спочатку увійдіть у систему!');
            }
        });
            userId = localStorage.getItem('userId');
            if (userId) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('logout-btn').style.display = '';
                fetchUserTags();
            }
        });
    </script>
</body>
</html>
